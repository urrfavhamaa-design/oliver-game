
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLIVER | THE EMPIRE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:white;
 font-family:Arial,sans-serif;text-align:center;
}
header{padding:28px 10px;color:#d6b66b;letter-spacing:4px}
h1{font-size:27px}
.balance{font-size:38px;color:#e7c778;margin:25px}
#coin{
 width:175px;height:175px;border-radius:50%;
 border:4px solid #d6b66b;background:linear-gradient(145deg,#29251a,#090b12);
 color:#f5d78b;font-size:75px;cursor:pointer;
 box-shadow:0 0 35px #b18a3655;
}
#coin:active{transform:scale(.94)}
button{cursor:pointer}
.stats{display:flex;justify-content:center;gap:35px;margin:25px}
.stat{color:#aaa}
.stat b{display:block;color:white;font-size:20px;margin-top:8px}
.upgrades{max-width:420px;margin:25px auto;padding:15px}
.item{
 background:#171b27;border:1px solid #393343;
 border-radius:12px;padding:17px;margin:12px 0;
 display:flex;justify-content:space-between;align-items:center;
}
.buy{background:#b99550;color:#111;border:0;padding:12px;border-radius:8px;font-weight:bold}
small{color:#aaa}
</style>
</head>
<body>
<header>
<h1>♛ OLIVER</h1>
THE EMPIRE
</header>

<div class="balance">💰 <span id="money">0</span></div>

<button id="coin" onclick="clickCoin()">👑</button>
<p> TAP TO EARN </p>

<div class="stats">
<div class="stat">LEVEL<b id="level">1</b></div>
<div class="stat">PER CLICK<b id="power">1</b></div>
</div>

<div class="upgrades">
<h2>UPGRADES</h2>
<div class="item">
<div>⚡ Power<br><small>+1 per click</small></div>
<button class="buy" onclick="buyPower()">Buy: <span id="cost">50</span></button>
</div>
<div class="item">
<div>👑 Royal Level<br><small>Increase your level</small></div>
<button class="buy" onclick="buyLevel()">Buy: <span id="levelCost">200</span></button>
</div>
</div>

<script>
let money=0,power=1,level=1;
let cost=50,levelCost=200;

function update(){
 document.getElementById("money").textContent=Math.floor(money).toLocaleString();
 document.getElementById("power").textContent=power;
 document.getElementById("level").textContent=level;
 document.getElementById("cost").textContent=cost;
 document.getElementById("levelCost").textContent=levelCost;
}
function clickCoin(){
 money+=power;
 update();
}
function buyPower(){
 if(money>=cost){
 money-=cost;
 power++;
 cost=Math.floor(cost*1.7);
 update();
 }
}
function buyLevel(){
 if(money>=levelCost){
 money-=levelCost;
 level++;
 levelCost=Math.floor(levelCost*2);
 update();
 }
}
update();
</script>
</body>
</html>
